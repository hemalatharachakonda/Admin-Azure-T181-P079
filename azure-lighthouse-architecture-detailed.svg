<line x1="485" y1="240" x2="485" y2="298" stroke="#0C447C" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="300" width="270" height="280" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="195" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Customer tenant A</text>
<text x="195" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Contoso Ltd</text>

<rect x="80" y="355" width="230" height="55" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
