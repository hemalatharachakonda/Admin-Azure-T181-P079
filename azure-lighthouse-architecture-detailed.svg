<text x="205" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Tier 1 ops, Tier 2 ops, audit</text>

<rect x="360" y="100" width="250" height="55" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="485" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Azure Policy</text>
<text x="485" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Compliance guardrails</text>

<rect x="70" y="170" width="540" height="55" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Central monitoring &amp; queries</text>
<text x="340" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Log Analytics, Sentinel, Resource Graph</text>

