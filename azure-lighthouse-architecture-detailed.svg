<svg width="680" height="650" viewBox="0 0 680 650" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Detailed Azure Lighthouse delegated administration architecture</title>
<desc>Provider tenant with admin AD groups, Azure Policy, and central monitoring, delegating scoped RBAC access via Lighthouse registrations into two customer tenants, each retaining its own local activity log.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0C447C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="650" fill="#ffffff"/>

<rect x="40" y="40" width="600" height="200" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#042C53">Provider tenant (MSP)</text>
<text x="340" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Single control plane for all customer tenants</text>

